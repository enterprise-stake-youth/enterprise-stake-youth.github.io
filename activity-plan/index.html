<!DOCTYPE html>
<!-- Built by tools/build_site.py from the Apps Script pages. Do not edit by hand. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stake Youth Permissions</title>
<style>
  :root { --ink:#1d2733; --muted:#5b6673; --line:#dde3ea; --bg:#f4f6f9; --card:#fff; --accent:#1f5f8b; --accent-soft:#e6f0f7; --warn:#fff4cc; --err:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:16px 16px 80px; }
  header { padding:18px 0 8px; }
  header h1 { font-size:22px; margin:0; }
  header .sub { color:var(--muted); }
  .test { background:#fde8e8; color:#8a1c1c; font-size:13px; padding:6px 10px; border-radius:6px; margin-top:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin:14px 0; }
  .card h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin:0 0 10px; }
  .step { display:inline-block; background:var(--accent); color:#fff; border-radius:50%; width:22px; height:22px; text-align:center; font-size:13px; line-height:22px; margin-right:6px; }
  details summary { cursor:pointer; color:var(--accent); font-weight:600; }
  pre.long { white-space:pre-wrap; font:14px/1.5 inherit; font-family:inherit; margin:10px 0 0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; }
  .grid .full { grid-column:1/-1; }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } }
  label.f { display:block; font-size:13px; color:var(--muted); margin-bottom:3px; }
  .ro { padding:8px 0; font-weight:600; }
  input[type=text], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:64px; resize:vertical; }
  .q { padding:10px 0; border-top:1px solid var(--line); }
  .q:first-of-type { border-top:0; }
  .yn { display:flex; gap:8px; margin:6px 0; }
  .yn label { flex:0 0 auto; border:1px solid var(--line); border-radius:999px; padding:6px 16px; cursor:pointer; user-select:none; }
  .yn input { display:none; }
  .yn input:checked + span { font-weight:700; }
  .yn label:has(input:checked) { background:var(--accent-soft); border-color:var(--accent); }
  .detail { margin-top:6px; }
  .hidden { display:none; }
  .check { display:flex; gap:10px; align-items:flex-start; padding:6px 0; }
  .check input { margin-top:4px; width:18px; height:18px; flex:0 0 auto; }
  .changed { background:var(--warn); border-radius:8px; }
  .changed-tag { font-size:12px; color:#8a6100; margin-left:6px; }
  .note { font-size:13px; color:var(--muted); }
  .perm { font-size:14px; background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:12px; }
  .perm p { margin:0 0 8px; }
  .handoff { background:var(--accent-soft); border-radius:8px; padding:10px 12px; margin:6px 0 10px; font-size:14px; }
  button { width:100%; padding:14px; font:600 17px inherit; font-family:inherit; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--err); font-weight:600; margin:10px 0; }
  .done { text-align:center; padding:40px 10px; }
  a { color:var(--accent); }

  /* start page */
  .field { margin:12px 0; }
  input[type=date], input[type=email] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  .hint { font-size:13px; color:var(--muted); margin-top:4px; min-height:1em; }
  .hint.bad { color:var(--err); }
  .hp { position:absolute; left:-5000px; width:1px; height:1px; overflow:hidden; }
  .sent { background:var(--accent-soft); border-radius:10px; padding:16px; }
  .sent .addr { font-size:20px; font-weight:700; margin:6px 0; word-break:break-all; }

/* Approve */

  table.plan { width:100%; border-collapse:collapse; font-size:14px; }
  table.plan th { text-align:left; color:var(--muted); font-weight:600; width:38%; padding:6px 8px 6px 0; vertical-align:top; }
  table.plan td { padding:6px 0; vertical-align:top; white-space:pre-wrap; }
  table.plan tr + tr th, table.plan tr + tr td { border-top:1px solid var(--line); }
  .two { display:flex; gap:10px; }
  .two button { flex:1; }
  button.alt { background:#fff; color:var(--accent); border:1px solid var(--accent); }

</style>
</head>
<body>
<div class="wrap" id="app"><p class="note" style="padding:40px 0;text-align:center">Loading…</p></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzIJ25F9DTuCFcb1QeCRG4AjgHOH9Ax0WtuAynwEtaX-x5_hu-UsKMm6jTDSL4iuBUJIg/exec';
const DEFAULT_PARAMS = /*DEFAULT_PARAMS*/{ page: 'lead' };

/** Talk to the Apps Script web app without Google sign-in cookies. */
async function api(fn, args) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args || [] }) });
  if (!res.ok) throw new Error('The server could not be reached (' + res.status + '). Please try again.');
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Something went wrong.');
  return j.result;
}

/** Stand-in for google.script.run so the page code runs unchanged. */
const google = { script: { get run() {
  let ok = () => {}, fail = () => {};
  const h = new Proxy({}, { get(_, name) {
    if (name === 'withSuccessHandler') return f => { ok = f; return h; };
    if (name === 'withFailureHandler') return f => { fail = f; return h; };
    return (...args) => { api(name, args).then(r => ok(r), e => fail(e)); };
  } });
  return h;
} } };

const PAGES = {};
PAGES.Start = function (M) {
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ev = M.event;
// Built on the server (leaderContact_): leader's name, email, phone, plus the stake youth email.
const leaderWho = ev.contact || ((ev.leader || 'the activity leader') +
  ([ev.leaderEmail, ev.leaderPhone].filter(Boolean).length ? ' (' + [ev.leaderEmail, ev.leaderPhone].filter(Boolean).join(', ') + ')' : ''));

function ymd(s) { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function ageOn(b, d) {
  let a = d.getFullYear() - b.getFullYear();
  if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--;
  return a;
}

function renderForm() {
  $('#app').innerHTML = `
<header>
  <h1>${esc(ev.name)}</h1>
  <div class="sub">${esc(ev.dates)} · Permission and Medical Release</div>
  ${M.testMode ? '<div class="test">Prototype / test mode — not a real sign-up.</div>' : ''}
</header>

<div class="card">
  <h2><span class="step">1</span>The event</h2>
  ${ev.short ? `<p style="margin-top:0">${esc(ev.short)}</p>` : ''}
  <details><summary>Read the full event details</summary><pre class="long">${esc(ev.long)}</pre></details>
</div>

<div class="card">
  <h2><span class="step">2</span>Who is signing up?</h2>
  <label class="check"><input type="checkbox" id="adult"><span>This participant is an <b>adult</b> (18 or older) signing up for themselves</span></label>
  <label class="check"><input type="checkbox" id="notInStake"><span>This participant is <b>not in the Enterprise Utah Stake</b> (new move-in, friend, nonmember, or from another stake)</span></label>
  <div class="grid">
    <div class="full field"><label class="f">Participant's name</label>
      <input type="text" name="youth" autocomplete="off" placeholder="First and last name (the name they go by is fine)"></div>
    <div class="field" id="dobWrap"><label class="f">Participant's date of birth</label>
      <input type="date" name="dob"><div class="hint" id="dobHint"></div></div>
    <div class="field" id="wardWrap"><label class="f">Ward or branch</label>
      <input type="text" name="ward"></div>
    <div class="field hidden" id="homeWrap"><label class="f">Home ward and stake (or "none")</label>
      <input type="text" name="homeUnit" placeholder="e.g. Cedar City 4th Ward, Cedar City Utah Stake"></div>
    <div class="full field" id="parentWrap"><label class="f">Parent or guardian's name</label>
      <input type="text" name="parent" autocomplete="name"></div>
    <div class="full field"><label class="f" id="emailLabel">Parent or guardian's email</label>
      <input type="email" name="email" autocomplete="email"></div>
  </div>
  <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
  <p class="note" id="privacyNote">We'll email you a secure review-and-sign link. If your email matches the one <b>in the Church directory on Tools</b>, the form comes filled in with the information we have on file. Otherwise you'll get a blank form to fill in, and we'll keep it for next time.</p>
  <div class="err" id="err"></div>
  <button id="go">Send me the secure link</button>
</div>
<p class="note" style="text-align:center">Questions? Contact ${esc(leaderWho)}.</p>`;

  $('[name=dob]').max = new Date().toISOString().slice(0, 10);
  $('[name=dob]').addEventListener('input', checkDob);
  ['adult', 'notInStake'].forEach(id => $('#' + id).addEventListener('change', sync));
  sync();
  $('#go').addEventListener('click', submit);
}

function sync() {
  const adult = $('#adult').checked, out = $('#notInStake').checked;
  $('#dobWrap').classList.toggle('hidden', adult);          // adults: birth date is asked when they sign
  $('#parentWrap').classList.toggle('hidden', adult);
  $('#wardWrap').classList.toggle('hidden', out);
  $('#homeWrap').classList.toggle('hidden', !out);
  $('#emailLabel').textContent = adult ? 'Your email' : "Parent or guardian's email";
  $('#privacyNote').classList.toggle('hidden', out);        // not in our directory: we use the email typed here
}

function checkDob() {
  const h = $('#dobHint'), b = ymd($('[name=dob]').value), start = ymd(ev.startDate) || new Date();
  h.classList.remove('bad');
  if (!b) { h.textContent = ''; return true; }
  if (b > new Date()) { h.textContent = 'That date is in the future.'; h.classList.add('bad'); return false; }
  h.textContent = `Age at the event: ${ageOn(b, start)}`;   // informational only: adults can sign up too
  return true;
}

function submit() {
  const f = {};
  ['youth', 'dob', 'ward', 'homeUnit', 'parent', 'email', 'website'].forEach(k => f[k] = ($(`[name=${k}]`).value || '').trim());
  f.adult = $('#adult').checked; f.notInStake = $('#notInStake').checked;
  if (f.adult) { f.dob = ''; f.parent = f.youth; }
  const err = $('#err'); err.textContent = '';
  const miss = !f.youth.includes(' ') ? "Please enter the participant's first and last name."
    : !f.adult && !f.dob ? "Please enter the participant's date of birth."
    : !f.adult && !checkDob() ? 'Please check the date of birth.'
    : f.notInStake && !f.homeUnit ? 'Please enter the home ward and stake (or "none").'
    : !f.notInStake && !f.ward ? 'Please enter your ward or branch.'
    : f.parent.length < 3 ? "Please enter the parent or guardian's name."
    : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email) ? 'Please enter a valid email address.' : '';
  if (miss) { err.textContent = miss; return; }
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Sending…';
  google.script.run
    .withSuccessHandler(r => showSent(f, r))
    .withFailureHandler(e => {
      err.textContent = (e && e.message || String(e)).replace(/^Error:\s*/, '');
      btn.disabled = false; btn.textContent = 'Send me the secure link';
    })
    .startRequest(M.eventId, f);
}

function showSent(f, r) {
  const first = esc(f.youth.split(/\s+/)[0]);
  $('#app').innerHTML = `
<header><h1>${esc(ev.name)}</h1><div class="sub">${esc(ev.dates)}</div></header>
<div class="card">
  <div class="sent">
    <div>📧 Check your email. We sent next steps for <b>${esc(f.youth)}</b> to:</div>
    <div class="addr">${esc(r.masked)}</div>
    <div class="note">${f.adult
      ? 'The link opens a page where you review your medical and emergency information and sign the official Church form. It takes about a minute.'
      : `The link opens a page where you review ${first}'s medical and emergency information, then you and ${first} both sign the official Church form. It takes about a minute.`}</div>
  </div>
  <p class="note">Nothing in a few minutes? Check spam or promotions, or contact ${esc(leaderWho)}.</p>
  <button id="again" style="background:#fff;color:var(--accent);border:1px solid var(--accent)">Sign up someone else</button>
</div>`;
  window.scrollTo(0, 0);
  $('#again').addEventListener('click', renderForm);
}

renderForm();

};

PAGES.Sign = function (M) {
const P = Object.assign({}, M.profile);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const changedTag = '<span class="changed-tag hidden">changed</span>';

function yn(key, question, detailKey, detailLabel) {
  return `<div class="q" data-k="${key}"><div>${question} ${changedTag}</div>
    <div class="yn">
      <label><input type="radio" name="${key}" value="Yes" ${P[key]==='Yes'?'checked':''}><span>Yes</span></label>
      <label><input type="radio" name="${key}" value="No" ${P[key]==='No'?'checked':''}><span>No</span></label>
    </div>
    ${detailKey ? `<div class="detail ${P[key]==='Yes'?'':'hidden'}" data-for="${key}" data-k="${detailKey}">
      <label class="f">${detailLabel}</label><input type="text" name="${detailKey}" value="${esc(P[detailKey])}"></div>` : ''}
  </div>`;
}
function txt(key, label, area) {
  return `<div class="full" data-k="${key}"><label class="f">${label} ${changedTag}</label>
    ${area ? `<textarea name="${key}">${esc(P[key])}</textarea>` : `<input type="text" name="${key}" value="${esc(P[key])}">`}</div>`;
}

const ev = M.event, y = M.youth, A = M.adult, who = esc(y.first || y.name.split(' ')[0]);
// Directory fields the family can correct; edits update the stake directory too.
const DIR = { DOB: y.dob, Address: y.address, City: y.city, State: y.state, Zip: y.zip, Phone: y.phone, Email: y.email };
const dirIn = (k, label, type, cls) => `<div class="${cls || ''}" data-k="${k}"><label class="f">${label} ${changedTag}</label>
  <input type="${type || 'text'}" name="${k}" value="${esc(DIR[k])}"></div>`;
// Built on the server (leaderContact_): leader's name, email, phone, plus the stake youth email.
const leaderWho = ev.contact || ((ev.leader || 'the activity leader') +
  ([ev.leaderEmail, ev.leaderPhone].filter(Boolean).length ? ' (' + [ev.leaderEmail, ev.leaderPhone].filter(Boolean).join(', ') + ')' : ''));
$('#app').innerHTML = `
<header>
  <h1>${esc(ev.name)}</h1>
  <div class="sub">${esc(ev.dates)} · Permission for <b>${esc(y.name)}</b></div>
  ${M.testMode ? '<div class="test">Prototype / test mode — not a real sign-up.</div>' : ''}
</header>
${M.unverified ? `<div class="handoff" style="background:var(--warn);font-size:15px">
  ⚠️ <b>${A ? 'Your email or information does not match Church records' : "Your email or your child's information does not match Church records"},</b>
  so we can't show the information we have on file. Please fill in the form below — we'll keep it for next time.<br><br>
  <b>If this is a mistake,</b> go back to the sign-up page and check the name, birth date, and the email that's in the
  Church directory on Tools:<br><a href="${esc(M.startLink)}" target="_top">${esc(M.startLink)}</a></div>` : ''}

<div class="card">
  <h2><span class="step">1</span>The event</h2>
  <details><summary>Read the full event details</summary><pre class="long">${esc(ev.long)}</pre></details>
</div>

<div class="card">
  <h2><span class="step">2</span>Contact information</h2>
  <div class="grid">
    <div><label class="f">Participant</label><div class="ro">${esc(y.name)}</div></div>
    ${dirIn('DOB', 'Date of birth' + (A && !y.dob ? ' (needed for the Church form)' : ''), 'date')}
    ${dirIn('Address', 'Street address', 'text', 'full')}
    ${dirIn('City', 'City')}
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">${dirIn('State', 'State')}${dirIn('Zip', 'ZIP')}</div>
    ${dirIn('Phone', 'Telephone number')}
    ${A ? dirIn('Email', 'Email', 'email') : '<div></div>'}
    ${txt('EmergencyName', A ? 'Emergency contact' : 'Emergency contact (parent or guardian)')}
    <div data-k="EmergencyPrimary"><label class="f">Primary phone ${changedTag}</label><input type="text" name="EmergencyPrimary" value="${esc(P.EmergencyPrimary)}"></div>
    <div data-k="EmergencySecondary"><label class="f">Secondary phone ${changedTag}</label><input type="text" name="EmergencySecondary" value="${esc(P.EmergencySecondary)}"></div>
  </div>
  <p class="note">Please correct anything that's out of date — your changes update our stake records for future events. (Let your ward clerk know too, so Church records match.)</p>
</div>

<div class="card">
  <h2><span class="step">3</span>Medical information</h2>
  <p class="note" style="margin-top:0">${M.hasProfile ? 'This is what we have on file. Please update anything that has changed.' : 'We don\'t have medical information on file yet — you\'ll only need to do this once.'}</p>
  ${yn('Diet', A ? 'Do you require a special diet?' : `Does ${who} require a special diet?`,'DietDetail','Dietary restrictions')}
  ${yn('Allergies', A ? 'Do you have any allergies?' : `Does ${who} have any allergies?`,'AllergyDetail','List the allergies')}
  <div class="q" data-k="Medications"><label class="f">Prescription or over-the-counter medications ${A ? 'you are' : who + ' is'} taking (leave blank if none) ${changedTag}</label>
    <textarea name="Medications">${esc(P.Medications)}</textarea></div>
  <div id="selfAdminWrap" class="${P.Medications?'':'hidden'}">${yn('SelfAdmin', (A ? 'Can you self-administer your medication?' : `Can ${who} self-administer the medication?`) + ' (If no, please also contact ' + esc(leaderWho) + ' directly.)')}</div>
</div>

<div class="card">
  <h2><span class="step">4</span>Conditions that limit activity</h2>
  ${yn('Chronic', A ? 'Do you have a chronic or recurring illness?' : `Does ${who} have a chronic or recurring illness?`,'ChronicDetail','Please explain')}
  ${yn('Surgery', A ? 'Have you had surgery or a serious illness in the past year?' : `Has ${who} had surgery or a serious illness in the past year?`,'SurgeryDetail','Please explain')}
  <div class="q">${txt('Limitations', 'Any other limits, restrictions, or disabilities that could prevent ' + (A ? 'you' : who) + ' from fully participating?',true)}</div>
  <div class="q">${txt('Accommodations','Other accommodations or special needs the leaders should know about',true)}</div>
</div>

<div class="card">
  <h2><span class="step">5</span>Permission &amp; signatures</h2>
  <div class="perm">
    <p>I give permission for my child or youth to participate in the event and activities listed above (unless noted) and authorize the adult leaders supervising this event to administer emergency treatment to the above-named participant for any accident or illness and to act in my stead in approving necessary medical care. This authorization shall cover this event and travel to and from this event.</p>
    <p><i>Please note:</i> Units may not have the ability to meet all medical, physical, and other accommodations and are asked to counsel with parents or guardians on what is possible.</p>
    <p>The participant is responsible for his or her own conduct and is aware of and agrees to abide by Church standards, camp or event safety rules, and other pertinent instructions. The participant's conduct and interactions should abide by Church standards and exemplify Christlike behavior, including those listed on the attached "Conduct at Church Activities."</p>
    <p>Parents and participants should understand that participation in an activity is not a right but a privilege that can be revoked if participants behave inappropriately or if they pose a risk to themselves or others.</p>
    <p style="margin:0">This information is collected to help event and activity leaders or medical personnel so they can be prepared and appropriately respond to health concerns or an emergency. It will be kept confidential and shared only as needed.</p>
  </div>
  <p class="note">Official form: <a href="${esc(M.formUrl)}" target="_blank">Permission and Medical Release Form</a> (page 2: Conduct at Church Activities). Your answers fill in this exact form.</p>

  ${A ? `
  <label class="f">Your signature (type your full name)</label>
  <input type="text" name="YouthSig" autocomplete="off" placeholder="${esc(y.name)}">
  <p class="note">You're signing as an adult participant, so no parent or guardian signature is needed.</p>
  <label class="check" style="margin-top:10px"><input type="checkbox" id="consent"><span>I agree that typing my name above is my electronic signature on the Church Permission and Medical Release Form for the event described above, and that the information on this page is accurate.</span></label>` : `
  <div class="handoff">👦 <b>Now hand the phone or computer to ${who}.</b><br>
    ${who}: read the paragraphs above about your conduct at Church activities, then type your full name to show you agree.</div>
  <label class="f">Participant's signature (type full name)</label>
  <input type="text" name="YouthSig" autocomplete="off" placeholder="${esc(y.name)}">

  <div class="handoff" style="margin-top:16px">👨‍👩‍👦 <b>Hand it back to the parent or guardian</b> to finish.</div>
  <label class="f">Parent or guardian's signature (type full name)</label>
  <input type="text" name="ParentSig" autocomplete="off" placeholder="${esc(M.parentName)}">
  <label class="check" style="margin-top:10px"><input type="checkbox" id="consent"><span>We agree that typing our names above constitutes our electronic signatures on the Church Permission and Medical Release Form for the event described above, and that the information on this page is accurate.</span></label>`}

  <div class="err" id="err"></div>
  <button id="go">Sign and submit</button>
</div>
`;

// Show/hide detail boxes and highlight edits vs what's on file
document.querySelectorAll('.yn input').forEach(r => r.addEventListener('change', () => {
  const d = document.querySelector(`.detail[data-for="${r.name}"]`);
  if (d) d.classList.toggle('hidden', r.value !== 'Yes');
  markChanges();
}));
document.querySelectorAll('input[type=text], input[type=email], input[type=date], textarea').forEach(i => i.addEventListener('input', markChanges));
markChanges();
$('[name=Medications]').addEventListener('input', e => $('#selfAdminWrap').classList.toggle('hidden', !e.target.value.trim()));

function val(name) {
  const r = document.querySelector(`input[name="${name}"]:checked`);
  if (r) return r.value;
  const t = document.querySelector(`[name="${name}"]:not([type=radio])`);
  return t ? t.value.trim() : '';
}
function markChanges() {
  // highlight edits vs what's on file (always for directory fields; medical only if we had a profile)
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if (!(k in DIR) && !M.hasProfile) return;
    const orig = k in DIR ? DIR[k] : P[k];
    const ch = String(val(k)) !== String(orig || '');
    el.classList.toggle('changed', ch);
    const tag = el.querySelector('.changed-tag'); if (tag) tag.classList.toggle('hidden', !ch);
  });
}

$('#go').addEventListener('click', () => {
  const f = {};
  ['DOB','Address','City','State','Zip','Phone','Email','EmergencyName','EmergencyPrimary','EmergencySecondary','Diet','DietDetail','Allergies','AllergyDetail',

PAGES.Approve = function (M) {
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p = M.plan;

$('#app').innerHTML = `
<header>
  <h1>${esc(p.eventName)}</h1>
  <div class="sub">Event and Activity Plan · approval by ${esc(M.approver.title.toLowerCase())}</div>
  ${M.testMode ? '<div class="test">Prototype / test mode — you are playing the approver. Nothing here is a real approval.</div>' : ''}
</header>

<div class="card"><h2>The plan</h2>
  <pre class="long" style="margin:0">${esc(M.planText)}</pre>
  <p class="note">The filled-in Church Event and Activity Plan is attached to the email that brought you here.</p></div>

<div class="card"><h2>Your decision</h2>
  <label class="f">Comments for the leader (optional)</label>
  <textarea name="note" placeholder="Any concerns or suggestions, e.g. Please add a second adult driver."></textarea>
  <p class="note" style="margin-top:4px">The leader is emailed your decision and these comments either way.</p>
  <label class="f" style="margin-top:12px">${esc(M.approver.title)}'s signature (type your full name to approve)</label>
  <input type="text" name="name" autocomplete="off" placeholder="${esc(M.approver.name)}">
  <label class="check" style="margin-top:10px"><input type="checkbox" id="consent"><span>Typing my name above is my electronic signature approving this Event and Activity Plan.</span></label>
  <div class="err" id="err"></div>
  <div class="two"><button id="ok">Approve</button><button id="back" class="alt">Return for changes</button></div>
</div>`;

function send(decision) {
  const f = { decision: decision, name: $('[name=name]').value.trim(), note: $('[name=note]').value.trim(), consent: $('#consent').checked };
  const err = $('#err'); err.textContent = '';
  if (decision === 'approve' && f.name.length < 3) { err.textContent = 'Please type your full name to approve.'; return; }
  if (decision === 'approve' && !f.consent) { err.textContent = 'Please check the box to sign electronically.'; return; }
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  google.script.run
    .withSuccessHandler(() => {
      $('#app').innerHTML = decision === 'approve'
        ? `<div class="card done"><h1>✅ Approved</h1><p>${esc(p.eventName)} is approved. The leader will be emailed the signed plan${f.note ? ' and your comments' : ''} in a minute or two.</p></div>`
        : `<div class="card done"><h1>↩️ Returned</h1><p>We emailed the leader your decision${f.note ? ' and comments' : ''}, with a link to update and resubmit the plan.</p></div>`;
      window.scrollTo(0, 0);
    })
    .withFailureHandler(e => { err.textContent = (e && e.message || String(e)).replace(/^Error:\s*/, ''); document.querySelectorAll('button').forEach(b => b.disabled = false); })
    .submitApproval(M.token, f);
}
$('#ok').addEventListener('click', () => send('approve'));
$('#back').addEventListener('click', () => send('return'));

};

(async function route() {
  const app = document.getElementById('app');
  let params = Object.fromEntries(new URLSearchParams(location.search));
  if (!Object.keys(params).length) params = DEFAULT_PARAMS;   // e.g. /lead → the leader page
  try {
    const r = await api('page', [params]);
    if (r.message) { app.innerHTML = r.message; return; }
    if (!PAGES[r.page]) throw new Error('Unknown page.');
    PAGES[r.page](r.model);
  } catch (e) {
    app.innerHTML = '<div class="card" style="margin-top:40px"><h2>Something went wrong</h2><p>' +
      String(e && e.message || e).replace(/[<>&]/g, '') + '</p><p class="note">Please try the link again in a minute.</p></div>';
  }
})();
</script>
